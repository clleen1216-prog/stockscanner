name: Daily Paper Trading

# One job does everything, so two workflows can never push at the same time.
# Weekdays 17:30 Taipei (09:30 UTC), after the Taiwan market closes.
on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: stockscanner-main-writes
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update paper trading ledger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; free key from fred.stlouisfed.org
        run: python paper_trade.py

      - name: Build daily digest
        run: python digest.py

      - name: Commit and push (retry on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper/ reports/DIGEST.md
          if [ -d data ]; then git add data; fi
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%F)"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase && git push; then ok=1; break; fi
            sleep $((i * 8))
          done
          [ "$ok" = 1 ]

      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure --color B60205 --force >/dev/null 2>&1 || true
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Daily job failed again: $url"
          else
            gh issue create --label pipeline-failure --title "Daily paper-trading job failed" \
              --body "The daily job failed. Nothing else to do unless this repeats for several days. Run: $url"
          fi
