name: Strategy Research

on:
  workflow_dispatch:  # manual only: run it from the Actions tab

permissions:
  contents: write

concurrency:
  group: stockscanner-main-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy research
        run: python research.py

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || (git commit -m "Add strategy research report" && git pull --rebase && git push)
