name: Fed Liquidity Test

on:
  workflow_dispatch:  # manual only: run it from the Actions tab

permissions:
  contents: write

jobs:
  fed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Fed liquidity test
        run: python fed_liquidity.py

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports_us/
          git diff --staged --quiet || (git commit -m "Add Fed liquidity report" && git pull --rebase && git push)
